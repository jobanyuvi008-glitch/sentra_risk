<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Sentra Risk — AI Cyber Risk Quantification Platform</title>
  <meta name="description" content="Turn cyber risk into financial decisions. Sentra Risk converts vulnerabilities and security telemetry into monetary exposure estimates for enterprise CISOs, risk officers, and executives." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Favicon inline SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232E5AAC'/><path d='M16 5L7 9v7c0 5 4 9 9 10 5-1 9-5 9-10V9z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

<div class="app-shell">

  <!-- ═══════════════════════════════════
       TOPBAR (Mobile Only)
  ═══════════════════════════════════════ -->
  <header class="topbar" id="topbar" role="banner">
    <div class="topbar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      Sentra Risk
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle-top" aria-label="Toggle theme" title="Toggle dark/light mode">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="icon-btn" id="hamburger-btn" aria-label="Open navigation menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════
       SIDEBAR OVERLAY (Mobile)
  ═══════════════════════════════════════ -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════
       SIDEBAR
  ═══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="logo-text">
        <div class="logo-name">Sentra Risk</div>
        <div class="logo-sub">Risk Intelligence</div>
      </div>
      <span class="demo-badge">DEMO</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

      <!-- Dashboard -->
      <div class="nav-item active" data-page="dashboard" id="nav-dashboard" role="button" tabindex="0" aria-label="Executive Dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </div>

      <!-- Risk Explorer -->
      <div class="nav-item" data-page="explorer" id="nav-explorer" role="button" tabindex="0" aria-label="Risk Explorer">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Risk Explorer
      </div>

      <!-- Scenario Simulator -->
      <div class="nav-item" data-page="simulator" id="nav-simulator" role="button" tabindex="0" aria-label="Scenario Simulator">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Scenario Simulator
      </div>

      <!-- Investment Optimizer -->
      <div class="nav-item" data-page="optimizer" id="nav-optimizer" role="button" tabindex="0" aria-label="Investment Optimizer">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Investment Optimizer
      </div>

      <!-- AI Assistant -->
      <div class="nav-item" data-page="assistant" id="nav-assistant" role="button" tabindex="0" aria-label="AI Risk Assistant">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        AI Assistant
      </div>

    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle theme">
        <!-- Icon injected by JS -->
        <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        Dark Mode
      </button>
      <div class="sidebar-bank-tag">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Sentra Bank Ltd.
      </div>
    </div>

  </aside>

  <!-- ═══════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════ -->
  <main class="main-content" role="main">
    <div id="page-content">
      <!-- Page content rendered by JS router -->
      <!-- Show loading state briefly -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-muted);font-size:13px;gap:10px;">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;animation:spin 1s linear infinite;">
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
        </svg>
        Loading…
      </div>
    </div>
  </main>

</div>

<!-- ═══════════════════════════════════
     GLOBAL LOADING SPINNER STYLE
═══════════════════════════════════════ -->
<style>
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>

<!-- ═══════════════════════════════════
     SCRIPTS (order matters)
═══════════════════════════════════════ -->
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Data Layer -->
<script src="js/data.js"></script>

<!-- Utilities -->
<script src="js/components.js"></script>
<script src="js/charts.js"></script>

<!-- Pages -->
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/explorer.js"></script>
<script src="js/pages/simulator.js"></script>
<script src="js/pages/optimizer.js"></script>
<script src="js/pages/assistant.js"></script>

<!-- App Router & Init -->
<script src="js/app.js"></script>

</body>
</html>
